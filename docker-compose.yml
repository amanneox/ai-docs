services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_docs
    # Host port 5433 → container 5432 (avoids clashing with a local Postgres).
    # The app connects to "db:5432" over the compose network regardless of this.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_docs"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        # NEXT_PUBLIC_* are inlined into the client bundle at build time, so they
        # must be supplied by the shell/deployment environment as build args.
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL:-/}
        NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL:-/}
        NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY: ${NEXT_PUBLIC_LIVEBLOCKS_PUBLIC_KEY:-}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Runtime secrets are supplied by the shell/deployment environment.
      # Gemini is optional; the application falls back to demo mode when unset.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      LIVEBLOCKS_SECRET_KEY: ${LIVEBLOCKS_SECRET_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Override so the app always talks to the db service, not localhost
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_docs

volumes:
  pgdata:
